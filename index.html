<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inventory Notebook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Patrick+Hand&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#efe6d2;
    --paper-dark:#e6dac0;
    --rule:rgba(93,120,153,0.28);
    --margin-red:#c0524b;
    --ink:#2b2b2b;
    --ink-soft:#5b5344;
    --accent-yellow:#f4d35e;
    --tab-1:#c0524b;
    --tab-2:#5c7a5e;
    --tab-3:#5d7899;
    --tab-4:#c68a3e;
    --tab-5:#8a6a9e;
    --shadow: 0 6px 16px rgba(0,0,0,0.18);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background: var(--paper-dark);
    font-family:'Patrick Hand', cursive;
    color: var(--ink);
    min-height:100vh;
    display:flex;
    justify-content:center;
    padding: 24px 12px 60px;
    background-image:
      radial-gradient(circle at 20% 10%, rgba(0,0,0,0.03), transparent 40%),
      radial-gradient(circle at 80% 90%, rgba(0,0,0,0.03), transparent 40%);
  }

  .notebook{
    width:100%;
    max-width:760px;
    position:relative;
  }

  .cover{
    text-align:center;
    margin-bottom:18px;
  }
  .cover h1{
    font-family:'Kalam', cursive;
    font-weight:700;
    font-size:2.1rem;
    color:var(--ink);
    margin:0;
    transform: rotate(-1deg);
  }
  .cover p{
    margin:4px 0 0;
    color:var(--ink-soft);
    font-size:1rem;
  }

  .export-btn{
    margin-top:10px;
    font-family:'Kalam', cursive;
    font-weight:700;
    font-size:0.9rem;
    background: transparent;
    color: var(--ink);
    border: 2px solid var(--ink);
    border-radius: 8px;
    padding: 6px 16px;
    cursor:pointer;
    transform: rotate(0.5deg);
  }
  .export-btn:hover{ background: var(--ink); color: var(--paper); }

  .page-wrap{
    position:relative;
    display:flex;
  }

  .tabs{
    display:flex;
    flex-direction:column;
    gap:10px;
    margin-top:46px;
    margin-right:-2px;
    z-index:2;
  }
  .tab{
    font-family:'Kalam', cursive;
    font-weight:700;
    font-size:0.95rem;
    color:#fff;
    padding:10px 14px 10px 16px;
    border-radius:8px 0 0 8px;
    cursor:pointer;
    box-shadow: -2px 3px 6px rgba(0,0,0,0.15);
    opacity:0.82;
    transform: translateX(6px);
    transition: transform .15s ease, opacity .15s ease;
    white-space:nowrap;
    border:none;
    text-align:left;
    position:relative;
  }
  .tab::after{
    content:'';
    position:absolute;
    right:0;
    bottom:0;
    width:13px;
    height:13px;
    background:var(--paper-dark);
    clip-path: polygon(100% 100%, 0 100%, 100% 0);
    filter: drop-shadow(1px 1px 1px rgba(0,0,0,0.25));
    pointer-events:none;
  }
  .tab:hover{ transform: translateX(0px); opacity:1;}
  .tab.active{ transform: translateX(0px); opacity:1; }
  .tab-add{
    background:transparent !important;
    color:var(--ink-soft) !important;
    box-shadow:none;
    border:2px dashed var(--ink-soft) !important;
    opacity:0.6;
  }
  .tab-add::after{ display:none; }
  .tab-icon{ display:none; }
  .tab-icon svg{ width:1.1rem; height:1.1rem; stroke:currentColor; vertical-align:-0.15em; }
  .tab-label{ display:inline; }
  .tab-label-icon{ display:inline-flex; vertical-align:-0.2em; }
  .tab-label-icon svg{ width:1.05rem; height:1.05rem; stroke:currentColor; }

  .page{
    flex:1;
    background: var(--paper);
    background-image: repeating-linear-gradient(
        var(--paper),
        var(--paper) 31px,
        var(--rule) 32px
      );
    border-radius: 4px 10px 10px 10px;
    box-shadow: var(--shadow);
    padding: 26px 22px 30px 56px;
    position:relative;
    min-height:420px;
  }
  .page::before{
    content:"";
    position:absolute;
    left:34px; top:0; bottom:0;
    width:2px;
    background: var(--margin-red);
    opacity:0.55;
  }
  @keyframes swipeInLeft{ from{ transform:translateX(18px); opacity:0.4; } to{ transform:translateX(0); opacity:1; } }
  @keyframes swipeInRight{ from{ transform:translateX(-18px); opacity:0.4; } to{ transform:translateX(0); opacity:1; } }
  .swipe-in-left{ animation: swipeInLeft .2s ease; }
  .swipe-in-right{ animation: swipeInRight .2s ease; }

  .location-title{
    font-family:'Kalam', cursive;
    font-weight:700;
    font-size:1.4rem;
    margin: 0 0 14px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
  }
  .location-title .title-main{
    display:flex;
    align-items:center;
    gap:8px;
    min-width:0;
  }
  .location-title .title-actions{
    display:flex;
    gap:6px;
    flex-shrink:0;
  }
  .location-title .del-loc, .location-title .edit-loc{
    font-family:'Space Mono', monospace;
    font-size:0.7rem;
    color:var(--ink-soft);
    background:none;
    border:1px solid var(--ink-soft);
    border-radius:6px;
    padding:3px 8px;
    cursor:pointer;
    opacity:0.6;
  }
  .location-title .del-loc:hover, .location-title .edit-loc:hover{opacity:1;}

  .item-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:5px 0;
    gap:10px;
  }
  .item-name{
    font-size:1.15rem;
    flex:1;
    min-width:0;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .item-count{
    font-family:'Space Mono', monospace;
    font-weight:700;
    font-size:1rem;
    background: var(--accent-yellow);
    padding:2px 10px;
    border-radius: 5px;
    transform: rotate(-1deg);
    min-width:34px;
    text-align:center;
  }
  .item-actions{
    display:flex;
    gap:4px;
  }
  .icon-btn{
    font-family:'Space Mono', monospace;
    width:26px; height:26px;
    border-radius:50%;
    border:1.5px solid var(--ink);
    background:transparent;
    color:var(--ink);
    cursor:pointer;
    font-size:0.95rem;
    line-height:1;
    display:flex;align-items:center;justify-content:center;
    opacity:0.75;
  }
  .icon-btn:hover{opacity:1; background:rgba(0,0,0,0.05);}
  .item-tag-btn{
    font-family:'Space Mono', monospace;
    font-size:0.65rem;
    color:var(--ink-soft);
    background:none;
    border:none;
    cursor:pointer;
    text-decoration:underline;
    opacity:0.65;
    padding:0;
  }

  .empty-note{
    font-size:1.05rem;
    color:var(--ink-soft);
    font-style:italic;
    margin-top:10px;
  }

  .item-controls{
    display:flex;
    gap:8px;
    align-items:center;
    margin-bottom:4px;
    flex-wrap:wrap;
  }
  .item-controls input[type="text"]{
    font-family:'Patrick Hand', cursive;
    font-size:1rem;
    background:transparent;
    border:none;
    border-bottom:2px dotted var(--ink-soft);
    padding:4px 2px;
    flex:1;
    min-width:100px;
    color:var(--ink);
  }
  .item-controls input[type="text"]:focus{ outline:none; border-bottom-color:var(--ink); }
  .sort-toggle{
    display:flex;
    border:1.5px solid var(--ink-soft);
    border-radius:8px;
    overflow:hidden;
    flex-shrink:0;
  }
  .sort-btn{
    font-family:'Space Mono', monospace;
    font-size:0.68rem;
    background:transparent;
    border:none;
    color:var(--ink-soft);
    padding:6px 10px;
    cursor:pointer;
  }
  .sort-btn + .sort-btn{ border-left:1.5px solid var(--ink-soft); }
  .sort-btn.active{ background:var(--accent-yellow); color:var(--ink); }

  .letter-group-header{
    font-family:'Space Mono', monospace;
    font-size:0.7rem;
    letter-spacing:0.05em;
    color:var(--ink-soft);
    margin:10px 0 2px;
    opacity:0.8;
  }
  .letter-group-header:first-child{ margin-top:0; }

  .item-count.zero{
    background:transparent;
    border:1.5px solid var(--margin-red);
    color:var(--margin-red);
  }

  .add-item-row{
    display:flex;
    gap:8px;
    margin-top:16px;
    flex-wrap:wrap;
  }
  .add-item-row input{
    font-family:'Patrick Hand', cursive;
    font-size:1.05rem;
    background:transparent;
    border:none;
    border-bottom: 2px dotted var(--ink-soft);
    padding:4px 2px;
    flex:1;
    min-width:120px;
    color:var(--ink);
  }
  .add-item-row input:focus{outline:none; border-bottom-color:var(--ink);}
  .add-item-row input[type="number"]{max-width:70px; flex:none;}
  .add-item-row button{
    font-family:'Kalam', cursive;
    font-weight:700;
    background:var(--ink);
    color:var(--paper);
    border:none;
    border-radius:6px;
    padding:6px 14px;
    cursor:pointer;
  }

  /* Modal / sticky-note popup */
  .overlay{
    position:fixed; inset:0;
    background:rgba(20,15,10,0.35);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:50;
    padding:20px;
  }
  .overlay.show{display:flex;}
  .sticky{
    background: var(--accent-yellow);
    width:100%;
    max-width:320px;
    padding:22px 20px 20px;
    border-radius:2px;
    box-shadow: 0 10px 26px rgba(0,0,0,0.35);
    transform: rotate(-1.5deg);
    position:relative;
    font-family:'Patrick Hand', cursive;
  }
  .sticky::before{
    content:"";
    position:absolute;
    top:-14px; left:50%;
    transform:translateX(-50%);
    width:26px;height:26px;
    background: var(--margin-red);
    border-radius:50%;
    box-shadow: 0 3px 4px rgba(0,0,0,0.3);
  }
  .sticky h2{
    font-family:'Kalam', cursive;
    margin:6px 0 4px;
    font-size:1.3rem;
  }
  .sticky .loc-label{
    font-family:'Space Mono', monospace;
    font-size:0.7rem;
    color:var(--ink-soft);
    text-transform:uppercase;
    letter-spacing:0.5px;
  }
  .counter-block{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:16px;
    margin:18px 0;
  }
  .counter-block button{
    width:44px;height:44px;
    border-radius:50%;
    border:2px solid var(--ink);
    background:var(--paper);
    font-size:1.4rem;
    font-family:'Space Mono', monospace;
    cursor:pointer;
  }
  .counter-block .count-display{
    font-family:'Space Mono', monospace;
    font-weight:700;
    font-size:1.8rem;
    min-width:50px;
    text-align:center;
  }
  .sticky-actions{
    display:flex;
    justify-content:flex-end;
    gap:8px;
  }
  .sticky-actions button{
    font-family:'Kalam', cursive;
    font-weight:700;
    border:none;
    border-radius:6px;
    padding:7px 14px;
    cursor:pointer;
    background: var(--ink);
    color: var(--paper);
  }

  .register-form label{
    display:block;
    font-family:'Space Mono', monospace;
    font-size:0.7rem;
    color:var(--ink-soft);
    margin-top:10px;
    text-transform:uppercase;
  }
  .register-form input, .register-form select{
    width:100%;
    font-family:'Patrick Hand', cursive;
    font-size:1.1rem;
    padding:6px 4px;
    background:transparent;
    border:none;
    border-bottom:2px dotted var(--ink-soft);
    margin-top:2px;
  }
  .register-form input:focus, .register-form select:focus{outline:none;}
  .register-form input.input-error{ border-bottom-color:var(--margin-red); }

  .icon-grid{
    display:grid;
    grid-template-columns: repeat(auto-fill, minmax(38px, 1fr));
    gap:6px;
    max-height:170px;
    overflow-y:auto;
    margin-top:6px;
    padding:6px;
    background:rgba(0,0,0,0.05);
    border-radius:8px;
  }
  .icon-choice{
    font-size:1.25rem;
    line-height:1;
    background:transparent;
    border:2px solid transparent;
    border-radius:8px;
    cursor:pointer;
    padding:7px 0;
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--ink);
  }
  .icon-choice:hover{ background:rgba(0,0,0,0.08); }
  .icon-choice.selected{ border-color:var(--ink); background:var(--accent-yellow); }
  .icon-choice svg{ width:20px; height:20px; stroke:currentColor; }

  .color-grid{
    display:grid;
    grid-template-columns: repeat(auto-fill, minmax(34px, 1fr));
    gap:8px;
    margin-top:6px;
    padding:6px;
    background:rgba(0,0,0,0.05);
    border-radius:8px;
  }
  .color-swatch{
    width:28px;
    height:28px;
    border-radius:50%;
    border:2px solid transparent;
    cursor:pointer;
    padding:0;
    box-shadow: inset 0 0 0 1px rgba(0,0,0,0.12);
    position:relative;
  }
  .color-swatch:hover{ transform:scale(1.08); }
  .color-swatch.selected{ border-color:var(--ink); }
  .color-swatch.selected::after{
    content:'✓';
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#fff;
    font-size:0.85rem;
    text-shadow:0 1px 1px rgba(0,0,0,0.4);
  }

  .icon-choice-add{
    border:2px dashed var(--ink-soft);
    color:var(--ink-soft);
    font-size:1.2rem;
    font-weight:700;
  }
  .icon-choice-add:hover{ color:var(--ink); border-color:var(--ink); background:rgba(0,0,0,0.05); }

  .icon-choice-wrap{ position:relative; }
  .icon-choice-wrap .icon-choice{ width:100%; }
  .icon-choice-del{
    position:absolute;
    top:-5px;
    right:-5px;
    width:16px;
    height:16px;
    line-height:14px;
    padding:0;
    font-size:0.6rem;
    border:1px solid var(--ink);
    border-radius:50%;
    background:var(--paper);
    color:var(--ink);
    cursor:pointer;
    opacity:0;
    transition:opacity 0.15s;
  }
  .icon-choice-wrap:hover .icon-choice-del{ opacity:1; }

  .icon-section-label{
    grid-column: 1 / -1;
    font-family:'Space Mono', monospace;
    font-size:0.68rem;
    letter-spacing:0.04em;
    text-transform:uppercase;
    color:var(--ink-soft);
    margin:8px 0 -2px;
    opacity:0.75;
  }
  .icon-section-label:first-child{ margin-top:0; }

  .loc-icon{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
  }
  .loc-icon svg{ width:22px; height:22px; stroke:currentColor; }

  .secondary-btn{
    background:transparent !important;
    color:var(--ink-soft) !important;
    border:1.5px solid var(--ink-soft) !important;
  }

  .tag-url-box{
    margin-top:12px;
    font-family:'Space Mono', monospace;
    font-size:0.65rem;
    background:rgba(0,0,0,0.06);
    padding:8px;
    border-radius:6px;
    word-break:break-all;
    cursor:pointer;
  }
  .tag-url-box .hint{
    display:block;
    font-family:'Patrick Hand', cursive;
    font-size:0.85rem;
    margin-bottom:4px;
    color:var(--ink-soft);
  }

  @media (max-width: 640px){
    body{ padding: 14px 8px 40px; }
    .cover h1{ font-size:1.6rem; }
    .cover p{ font-size:0.9rem; }

    /* Stack the notebook tabs above the page as a wrapping row of
       icon-only buttons instead of a vertical column beside it —
       a side-by-side layout doesn't fit narrow screens, and full
       names wrapped/scrolled awkwardly. */
    .page-wrap{ flex-direction:column; }
    .tabs{
      flex-direction:row;
      flex-wrap:wrap;
      margin-top:0;
      margin-right:0;
      margin-bottom:10px;
      gap:8px;
    }
    .tab{
      flex:none;
      width:44px;
      height:44px;
      padding:0;
      border-radius:10px;
      transform:none !important;
      box-shadow: 0 2px 6px rgba(0,0,0,0.15);
      display:flex;
      align-items:center;
      justify-content:center;
    }
    .tab:hover, .tab.active{ transform:none !important; }
    .tab::after{
      left:auto;
      right:0;
      bottom:0;
      width:11px;
      height:11px;
      clip-path: polygon(100% 100%, 0 100%, 100% 0);
      filter: drop-shadow(1px 1px 1px rgba(0,0,0,0.25));
      transform-origin: 100% 100%;
    }
    .tab.active::after{
      animation: pageTurn .35s ease forwards;
    }
    @keyframes pageTurn{
      0%{ transform: rotate(0deg) scale(1); }
      55%{ transform: rotate(-35deg) scale(1.5); }
      100%{ transform: rotate(-14deg) scale(1.45); }
    }
    .tab-icon{ display:inline; font-size:1.3rem; line-height:1; }
    .tab-icon svg{ width:1.3rem; height:1.3rem; stroke:currentColor; vertical-align:middle; }
    .tab-label{ display:none; }

    .page{ padding:18px 14px 24px 34px; border-radius:0 10px 10px 10px; }
    .page::before{ left:20px; }

    /* Let each inventory row wrap onto two lines: name on its own
       line, count + actions together below, both with roomier
       touch targets. */
    .item-row{
      flex-wrap:wrap;
      row-gap:8px;
      padding:10px 0;
      border-bottom:1px solid var(--rule);
    }
    .item-name{ flex-basis:100%; white-space:normal; font-size:1.1rem; }
    .item-tag-btn{ order:3; }
    .item-count{ order:1; font-size:1.05rem; padding:4px 12px; }
    .item-actions{ order:2; margin-left:auto; gap:6px; }
    .icon-btn{ width:34px; height:34px; font-size:1.05rem; }

    .add-item-row input{ font-size:1rem; }
    .add-item-row input[type="number"]{ max-width:64px; }
    .add-item-row button{ padding:8px 16px; }

    .sticky{ max-width:100%; padding:20px 16px 18px; }
    .counter-block button{ width:48px; height:48px; }
  }
</style>
</head>
<body>

<div class="notebook">
  <div class="cover">
    <h1>📓 Inventory Notebook</h1>
    <p>Tap an NFC tag on any bin, shelf, or box to update its count</p>
    <button id="exportCsvBtn" class="export-btn">⬇ Export CSV</button>
  </div>

  <div class="page-wrap">
    <div class="tabs" id="tabs"></div>
    <div class="page" id="page">
      <!-- filled by JS -->
    </div>
  </div>
</div>

<!-- Adjust-count popup (known tag / manual item tap) -->
<div class="overlay" id="adjustOverlay">
  <div class="sticky">
    <div class="loc-label" id="adjustLoc">LOCATION</div>
    <h2 id="adjustName">Item</h2>
    <div class="counter-block">
      <button id="adjustMinus">−</button>
      <div class="count-display" id="adjustCount">0</div>
      <button id="adjustPlus">+</button>
    </div>
    <div class="sticky-actions">
      <button id="adjustDone">Done</button>
    </div>
  </div>
</div>

<!-- Add new place popup (replaces the old browser prompt) -->
<div class="overlay" id="addPlaceOverlay">
  <div class="sticky">
    <div class="loc-label" id="placeOverlayLabel">New Storage Place</div>
    <h2 id="placeOverlayTitle">Add a place</h2>
    <div class="register-form">
      <label>Icon</label>
      <div class="icon-grid" id="iconGrid"></div>
      <label>Tab color</label>
      <div class="color-grid" id="colorGrid"></div>
      <label>Name</label>
      <input type="text" id="placeName" placeholder="e.g. Garage Shelf">
    </div>
    <div class="sticky-actions" style="margin-top:16px;">
      <button id="placeCancel" class="secondary-btn">Cancel</button>
      <button id="placeSave">Save</button>
    </div>
  </div>
</div>

<!-- Register new tag popup (unknown tag scanned) -->
<div class="overlay" id="registerOverlay">
  <div class="sticky">
    <div class="loc-label">New NFC Tag</div>
    <h2>Name this item</h2>
    <div class="register-form">
      <label>Location</label>
      <select id="regLocation"></select>
      <label>Item name</label>
      <input type="text" id="regName" placeholder="e.g. Eggs">
      <label>Starting count</label>
      <input type="number" id="regCount" value="1" min="0">
    </div>
    <div class="sticky-actions" style="margin-top:16px;">
      <button id="regSave">Save & Continue</button>
    </div>
  </div>
</div>

<!-- Tag link popup (show URL to write to a physical tag) -->
<div class="overlay" id="linkOverlay">
  <div class="sticky">
    <div class="loc-label">Write to NFC tag</div>
    <h2 id="linkItemName">Item</h2>
    <div class="tag-url-box" id="linkUrlBox">
      <span class="hint">Tap to copy — paste into NFC Tools as a URL record</span>
      <span id="linkUrlText"></span>
    </div>
    <div class="sticky-actions" style="margin-top:16px;">
      <button id="linkDone">Close</button>
    </div>
  </div>
</div>

<script>
  const STORAGE_KEY = 'inventory-notebook-data-v1';
  const TAB_COLORS = ['var(--tab-1)','var(--tab-2)','var(--tab-3)','var(--tab-4)','var(--tab-5)'];
  const TAB_SWATCHES = [
    '#c0524b', '#c68a3e', '#8a8a4e', '#5c7a5e', '#3f7d6b',
    '#5d7899', '#5a6da8', '#8a6a9e', '#b45f7a', '#a85a3f',
    '#9e7b4f', '#4a5d6b'
  ];

  function loadData(){
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){ try{ return JSON.parse(raw); }catch(e){ /* fall through */ } }
    // starter data
    return {
      locations: [
        {id:'fridge', name:'🥚 Fridge'},
        {id:'freezer', name:'🧊 Freezer'},
        {id:'pantry', name:'🥫 Pantry'}
      ],
      items: [
        {id:'item-egg', tagId:'egg01', locationId:'fridge', name:'Eggs', count:6},
        {id:'item-meat', tagId:'meat01', locationId:'freezer', name:'Meat', count:2}
      ],
      activeLocation:'fridge'
    };
  }
  function saveData(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); }
  function uid(prefix){ return prefix + '-' + Math.random().toString(36).slice(2,9); }

  let data = loadData();

  // ---- Custom icons (user-added, saved separately so they survive resets) ----
  const CUSTOM_ICONS_KEY = 'inventory-notebook-custom-icons-v1';
  function loadCustomIcons(){
    const raw = localStorage.getItem(CUSTOM_ICONS_KEY);
    if(raw){ try{ return JSON.parse(raw); }catch(e){ /* fall through */ } }
    return [];
  }
  function saveCustomIcons(){ localStorage.setItem(CUSTOM_ICONS_KEY, JSON.stringify(customIcons)); }
  let customIcons = loadCustomIcons();

  // Very light sanitizing for pasted SVG markup — strips script tags and
  // inline event handlers before it ever touches innerHTML.
  function sanitizeSvg(svg){
    return svg
      .replace(/<script[\s\S]*?<\/script>/gi, '')
      .replace(/\son\w+\s*=\s*"[^"]*"/gi, '')
      .replace(/\son\w+\s*=\s*'[^']*'/gi, '');
  }

  // Pulls a short icon out of a location name for the mobile tab
  // strip — the leading emoji if the name starts with one (e.g.
  // "🥚 Fridge" -> "🥚"), otherwise the first letter as a fallback.
  function tabIcon(name){
    const trimmed = name.trim();
    const firstToken = trimmed.split(' ')[0];
    if(/[^\x00-\x7F]/.test(firstToken)){ return firstToken; }
    return trimmed.charAt(0).toUpperCase();
  }

  function renderTabs(){
    const tabsEl = document.getElementById('tabs');
    tabsEl.innerHTML = '';
    data.locations.forEach((loc, i) => {
      const btn = document.createElement('button');
      btn.className = 'tab' + (loc.id === data.activeLocation ? ' active' : '');
      btn.style.background = loc.color || TAB_COLORS[i % TAB_COLORS.length];
      btn.title = loc.name;
      const tabLabel = loc.icon ? `<span class="tab-label-icon">${iconGlyph(loc.icon)}</span> ${loc.name}` : loc.name;
      btn.innerHTML = `<span class="tab-icon">${iconGlyph(loc.icon) || tabIcon(loc.name)}</span><span class="tab-label">${tabLabel}</span>`;
      btn.onclick = () => { data.activeLocation = loc.id; saveData(); render(); };
      tabsEl.appendChild(btn);
    });
    const addBtn = document.createElement('button');
    addBtn.className = 'tab tab-add';
    addBtn.title = 'Add a new place';
    addBtn.innerHTML = `<span class="tab-icon">+</span><span class="tab-label">+ new place</span>`;
    addBtn.onclick = () => { openAddPlace(); };
    tabsEl.appendChild(addBtn);
  }

  // ---- Item search / sort (kept outside renderPage so typing doesn't
  // trigger a full page rebuild and steal focus from the search box) ----
  let itemQuery = '';
  const SORT_MODE_KEY = 'inventory-notebook-sort-mode';
  let itemSortMode = localStorage.getItem(SORT_MODE_KEY) || 'alpha';
  function saveSortMode(){ localStorage.setItem(SORT_MODE_KEY, itemSortMode); }

  function itemRowHTML(it){
    const countClass = it.count === 0 ? ' zero' : '';
    return `
      <div class="item-row">
        <div class="item-name">${it.name}</div>
        <button class="item-tag-btn" data-showlink="${it.id}">tag link</button>
        <div class="item-count${countClass}" data-openadjust="${it.id}">${it.count}</div>
        <div class="item-actions">
          <button class="icon-btn" data-quickminus="${it.id}">−</button>
          <button class="icon-btn" data-quickplus="${it.id}">+</button>
          <button class="icon-btn" data-delitem="${it.id}">✕</button>
        </div>
      </div>`;
  }

  function renderItemsList(){
    const loc = data.locations.find(l => l.id === data.activeLocation) || data.locations[0];
    const listEl = document.getElementById('itemsList');
    if(!loc || !listEl) return;

    const allItems = data.items.filter(it => it.locationId === loc.id);
    const query = itemQuery.trim().toLowerCase();
    let items = query ? allItems.filter(it => it.name.toLowerCase().includes(query)) : allItems;

    if(allItems.length === 0){
      listEl.innerHTML = `<p class="empty-note">Nothing logged here yet. Add an item below.</p>`;
    } else if(items.length === 0){
      listEl.innerHTML = `<p class="empty-note">No items match your search.</p>`;
    } else if(itemSortMode === 'stock'){
      items = [...items].sort((a, b) => a.count - b.count || a.name.localeCompare(b.name));
      listEl.innerHTML = items.map(itemRowHTML).join('');
    } else {
      items = [...items].sort((a, b) => a.name.localeCompare(b.name));
      let html = '';
      let lastLetter = '';
      items.forEach(it => {
        const letter = (it.name.trim().charAt(0) || '#').toUpperCase();
        if(letter !== lastLetter){
          html += `<div class="letter-group-header">${letter}</div>`;
          lastLetter = letter;
        }
        html += itemRowHTML(it);
      });
      listEl.innerHTML = html;
    }

    listEl.querySelectorAll('[data-openadjust]').forEach(el => {
      el.onclick = () => openAdjust(el.dataset.openadjust);
    });
    listEl.querySelectorAll('[data-quickplus]').forEach(el => {
      el.onclick = () => { changeCount(el.dataset.quickplus, 1); };
    });
    listEl.querySelectorAll('[data-quickminus]').forEach(el => {
      el.onclick = () => { changeCount(el.dataset.quickminus, -1); };
    });
    listEl.querySelectorAll('[data-delitem]').forEach(el => {
      el.onclick = () => {
        if(confirm('Remove this item from the notebook?')){
          data.items = data.items.filter(it => it.id !== el.dataset.delitem);
          saveData(); renderItemsList();
        }
      };
    });
    listEl.querySelectorAll('[data-showlink]').forEach(el => {
      el.onclick = () => showLink(el.dataset.showlink);
    });
  }

  function renderPage(){
    const page = document.getElementById('page');
    const loc = data.locations.find(l => l.id === data.activeLocation) || data.locations[0];
    if(!loc){ page.innerHTML = '<p class="empty-note">No places yet. Add one with the tab on the left.</p>'; return; }

    const titleLabel = loc.icon ? `${locIconHTML(loc)}<span>${loc.name}</span>` : `<span>${loc.name}</span>`;
    let html = `<div class="location-title"><span class="title-main">${titleLabel}</span>`;
    html += `<div class="title-actions"><button class="edit-loc" data-loc="${loc.id}">edit</button><button class="del-loc" data-loc="${loc.id}">remove place</button></div></div>`;

    html += `
      <div class="item-controls">
        <input type="text" id="itemSearch" placeholder="Search items..." value="${itemQuery.replace(/"/g, '&quot;')}">
        <div class="sort-toggle">
          <button type="button" class="sort-btn${itemSortMode === 'alpha' ? ' active' : ''}" data-sort="alpha">A–Z</button>
          <button type="button" class="sort-btn${itemSortMode === 'stock' ? ' active' : ''}" data-sort="stock">Low stock</button>
        </div>
      </div>
      <div id="itemsList"></div>`;

    html += `
      <div class="add-item-row">
        <input type="text" id="newItemName" placeholder="New item name...">
        <input type="number" id="newItemCount" value="1" min="0">
        <button id="addItemBtn">Add</button>
      </div>`;

    page.innerHTML = html;
    renderItemsList();

    const searchEl = document.getElementById('itemSearch');
    searchEl.oninput = () => { itemQuery = searchEl.value; renderItemsList(); };

    page.querySelectorAll('.sort-btn').forEach(btn => {
      btn.onclick = () => {
        itemSortMode = btn.dataset.sort;
        saveSortMode();
        page.querySelectorAll('.sort-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        renderItemsList();
      };
    });

    const editLocBtn = page.querySelector('.edit-loc');
    if(editLocBtn){
      editLocBtn.onclick = () => openEditPlace(loc.id);
    }
    const delLocBtn = page.querySelector('.del-loc');
    if(delLocBtn){
      delLocBtn.onclick = () => {
        if(confirm('Remove this place and all its items?')){
          data.items = data.items.filter(it => it.locationId !== loc.id);
          data.locations = data.locations.filter(l => l.id !== loc.id);
          data.activeLocation = data.locations[0] ? data.locations[0].id : null;
          saveData(); render();
        }
      };
    }
    const addBtn = document.getElementById('addItemBtn');
    if(addBtn){
      addBtn.onclick = () => {
        const nameEl = document.getElementById('newItemName');
        const countEl = document.getElementById('newItemCount');
        const name = nameEl.value.trim();
        if(!name) return;
        const count = parseInt(countEl.value, 10) || 0;
        const id = uid('item');
        const tagId = uid('tag');
        data.items.push({id, tagId, locationId: loc.id, name, count});
        saveData(); render();
        showLink(id);
      };
    }
  }

  function render(){ renderTabs(); renderPage(); }

  function changeCount(itemId, delta){
    const it = data.items.find(i => i.id === itemId);
    if(!it) return;
    it.count = Math.max(0, it.count + delta);
    saveData(); renderItemsList();
  }

  // ---- Adjust popup (tap a count, or scan a known tag) ----
  let adjustingId = null;
  function openAdjust(itemId){
    const it = data.items.find(i => i.id === itemId);
    if(!it) return;
    adjustingId = itemId;
    const loc = data.locations.find(l => l.id === it.locationId);
    document.getElementById('adjustLoc').textContent = loc ? loc.name : '';
    document.getElementById('adjustName').textContent = it.name;
    document.getElementById('adjustCount').textContent = it.count;
    document.getElementById('adjustOverlay').classList.add('show');
  }
  document.getElementById('adjustPlus').onclick = () => {
    const it = data.items.find(i => i.id === adjustingId);
    if(!it) return;
    it.count += 1;
    document.getElementById('adjustCount').textContent = it.count;
    saveData();
  };
  document.getElementById('adjustMinus').onclick = () => {
    const it = data.items.find(i => i.id === adjustingId);
    if(!it) return;
    it.count = Math.max(0, it.count - 1);
    document.getElementById('adjustCount').textContent = it.count;
    saveData();
  };
  document.getElementById('adjustDone').onclick = () => {
    document.getElementById('adjustOverlay').classList.remove('show');
    // clean the ?tag= param from the URL so a refresh doesn't reopen it
    if(window.history && window.history.replaceState){
      window.history.replaceState({}, '', window.location.pathname);
    }
    render();
  };

  // ---- Add place popup (icon picker + name, replaces the old prompt()) ----
  // Real kitchen-equipment icons — simple line-drawn SVGs (id -> markup),
  // stored on the location as icon:"svg:<id>".
  const KITCHEN_ICONS = [
    { id:'fridge', label:'Fridge',
      svg:'<svg viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="2" width="14" height="20" rx="1.5"/><line x1="5" y1="9" x2="19" y2="9"/><line x1="8" y1="4.5" x2="8" y2="7.5"/><line x1="8" y1="11.5" x2="8" y2="15"/></svg>' },
    { id:'freezer', label:'Freezer',
      svg:'<svg viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="9" width="20" height="11" rx="1.5"/><line x1="2" y1="9" x2="22" y2="9"/><rect x="9" y="5" width="6" height="4" rx="1"/></svg>' },
    { id:'walkin', label:'Walk-in Cooler',
      svg:'<svg viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="2" width="16" height="20" rx="1"/><line x1="8" y1="14" x2="8" y2="20"/><line x1="10.5" y1="14" x2="10.5" y2="20"/><line x1="13" y1="14" x2="13" y2="20"/><line x1="15.5" y1="14" x2="15.5" y2="20"/><circle cx="17" cy="12" r="0.7" fill="currentColor"/></svg>' },
    { id:'drawerfridge', label:'Drawer Fridge',
      svg:'<svg viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="2" width="16" height="20" rx="1.5"/><line x1="4" y1="8.5" x2="20" y2="8.5"/><line x1="4" y1="15" x2="20" y2="15"/><line x1="9" y1="5.2" x2="15" y2="5.2"/><line x1="9" y1="11.7" x2="15" y2="11.7"/><line x1="9" y1="18.2" x2="15" y2="18.2"/></svg>' },
    { id:'shelf', label:'Shelf / Rack',
      svg:'<svg viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="4" x2="3" y2="21"/><line x1="21" y1="4" x2="21" y2="21"/><line x1="3" y1="8" x2="21" y2="8"/><line x1="3" y1="13.5" x2="21" y2="13.5"/><line x1="3" y1="19" x2="21" y2="19"/></svg>' },
    { id:'cabinet', label:'Cabinet',
      svg:'<svg viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="1"/><line x1="12" y1="3" x2="12" y2="21"/><circle cx="10" cy="12" r="0.7" fill="currentColor"/><circle cx="14" cy="12" r="0.7" fill="currentColor"/></svg>' },
    { id:'pantry', label:'Pantry',
      svg:'<svg viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="2" width="16" height="20" rx="1"/><line x1="4" y1="9" x2="20" y2="9"/><line x1="4" y1="16" x2="20" y2="16"/><rect x="6.5" y="5" width="2.4" height="4" rx="0.4"/><rect x="10" y="4.3" width="2.4" height="4.7" rx="0.4"/><rect x="14" y="5.3" width="2.4" height="3.7" rx="0.4"/></svg>' },
    { id:'counter', label:'Prep Counter',
      svg:'<svg viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="3" rx="1"/><line x1="5" y1="8" x2="5" y2="21"/><line x1="19" y1="8" x2="19" y2="21"/></svg>' },
    { id:'sink', label:'Sink',
      svg:'<svg viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="8" width="18" height="10" rx="2"/><path d="M15 8 V5 a1 1 0 0 1 1-1 h2 a1 1 0 0 1 1 1"/><line x1="18" y1="4" x2="18" y2="7"/><circle cx="12" cy="17" r="0.7" fill="currentColor"/></svg>' },
    { id:'icemachine', label:'Ice Machine',
      svg:'<svg viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="2" width="16" height="20" rx="1.5"/><line x1="4" y1="13" x2="20" y2="13"/><rect x="8" y="15.5" width="3" height="3" rx="0.5"/><rect x="13" y="15.5" width="3" height="3" rx="0.5"/></svg>' },
    { id:'drystorage', label:'Dry Storage',
      svg:'<svg viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="13" width="8" height="7" rx="0.8"/><rect x="13" y="13" width="8" height="7" rx="0.8"/><rect x="8" y="4" width="8" height="7" rx="0.8"/></svg>' },
    { id:'box', label:'Storage Box',
      svg:'<svg viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="8" width="18" height="13" rx="1"/><path d="M3 8 l4-5 h10 l4 5"/><line x1="12" y1="8" x2="12" y2="21"/></svg>' }
  ];
  const KITCHEN_ICON_MAP = {};
  KITCHEN_ICONS.forEach(k => { KITCHEN_ICON_MAP[k.id] = k; });

  // Original general-purpose emoji set, kept as a second picker section.
  const EMOJI_ICONS = [
    '🥚','🥫','🧀','🍞','🥖','🍎','🍌','🍅','🥕',
    '🧃','🥤','🍺','🍷','🧂','☕','🍯','🧴','🧼','🧻',
    '🧺','🧹','🧽','🪣','🚪','🏠','🏡','🚗','🚲','🛠️',
    '🔧','🔩','⚙️','📦','🗄️','📚','👕','🧦','👟','🎒',
    '🎁','🧸','🐾','🌱','🪴','🎨','🔥','❄️','🌡️','💊',
    '🩹','🧯','🔑','🪑','🛁','🚿','🔌','💡','🧵','🪛'
  ];

  // Renders any icon value ("svg:id" or a raw emoji) as HTML markup.
  function iconGlyph(iconValue){
    if(!iconValue) return '';
    if(iconValue.startsWith('svg:')){
      const k = KITCHEN_ICON_MAP[iconValue.slice(4)];
      return k ? k.svg : '';
    }
    if(iconValue.startsWith('custom:')){
      const c = customIcons.find(c => c.id === iconValue.slice(7));
      return c ? c.svg : '';
    }
    return iconValue;
  }

  // Icon + label for a location: prefers the explicit icon field, falling
  // back to the old behavior (emoji baked into the name) for places saved
  // before this feature existed.
  function locIconHTML(loc){
    if(loc.icon) return `<span class="loc-icon">${iconGlyph(loc.icon)}</span>`;
    return `<span class="loc-icon">${tabIcon(loc.name)}</span>`;
  }

  let selectedPlaceIcon = `svg:${KITCHEN_ICONS[0].id}`;
  let selectedPlaceColor = TAB_SWATCHES[0];
  let editingLocId = null;

  // Renders the icon grid + color grid to reflect the current selections,
  // without touching the name field, title, or overlay visibility — used
  // both on first open and to refresh after adding/removing a custom icon.
  function renderPlaceForm(){
    const grid = document.getElementById('iconGrid');
    grid.innerHTML = '';

    const kitchenLabel = document.createElement('div');
    kitchenLabel.className = 'icon-section-label';
    kitchenLabel.textContent = 'Kitchen equipment';
    grid.appendChild(kitchenLabel);

    KITCHEN_ICONS.forEach(k => {
      const value = `svg:${k.id}`;
      const b = document.createElement('button');
      b.type = 'button';
      b.title = k.label;
      b.className = 'icon-choice' + (value === selectedPlaceIcon ? ' selected' : '');
      b.innerHTML = k.svg;
      b.onclick = () => {
        selectedPlaceIcon = value;
        grid.querySelectorAll('.icon-choice').forEach(el => el.classList.remove('selected'));
        b.classList.add('selected');
      };
      grid.appendChild(b);
    });

    const otherLabel = document.createElement('div');
    otherLabel.className = 'icon-section-label';
    otherLabel.textContent = 'Other';
    grid.appendChild(otherLabel);

    EMOJI_ICONS.forEach(icon => {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'icon-choice' + (icon === selectedPlaceIcon ? ' selected' : '');
      b.textContent = icon;
      b.onclick = () => {
        selectedPlaceIcon = icon;
        grid.querySelectorAll('.icon-choice').forEach(el => el.classList.remove('selected'));
        b.classList.add('selected');
      };
      grid.appendChild(b);
    });

    const customLabel = document.createElement('div');
    customLabel.className = 'icon-section-label';
    customLabel.textContent = 'Custom';
    grid.appendChild(customLabel);

    customIcons.forEach(c => {
      const value = `custom:${c.id}`;
      const wrap = document.createElement('div');
      wrap.className = 'icon-choice-wrap';
      const b = document.createElement('button');
      b.type = 'button';
      b.title = c.label;
      b.className = 'icon-choice' + (value === selectedPlaceIcon ? ' selected' : '');
      b.innerHTML = c.svg;
      b.onclick = () => {
        selectedPlaceIcon = value;
        grid.querySelectorAll('.icon-choice').forEach(el => el.classList.remove('selected'));
        b.classList.add('selected');
      };
      const del = document.createElement('button');
      del.type = 'button';
      del.className = 'icon-choice-del';
      del.title = 'Remove this custom icon';
      del.textContent = '✕';
      del.onclick = (e) => {
        e.stopPropagation();
        if(!confirm(`Remove the "${c.label}" icon?`)) return;
        customIcons = customIcons.filter(ci => ci.id !== c.id);
        saveCustomIcons();
        if(selectedPlaceIcon === value) selectedPlaceIcon = `svg:${KITCHEN_ICONS[0].id}`;
        renderPlaceForm();
      };
      wrap.appendChild(b);
      wrap.appendChild(del);
      grid.appendChild(wrap);
    });

    const addTile = document.createElement('button');
    addTile.type = 'button';
    addTile.className = 'icon-choice icon-choice-add';
    addTile.title = 'Add a new icon';
    addTile.textContent = '+';
    addTile.onclick = () => openAddCustomIcon();
    grid.appendChild(addTile);

    const colorGrid = document.getElementById('colorGrid');
    colorGrid.innerHTML = '';
    TAB_SWATCHES.forEach(color => {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'color-swatch' + (color === selectedPlaceColor ? ' selected' : '');
      b.style.background = color;
      b.title = color;
      b.onclick = () => {
        selectedPlaceColor = color;
        colorGrid.querySelectorAll('.color-swatch').forEach(el => el.classList.remove('selected'));
        b.classList.add('selected');
      };
      colorGrid.appendChild(b);
    });
  }

  function openAddPlace(){
    editingLocId = null;
    selectedPlaceIcon = `svg:${KITCHEN_ICONS[0].id}`;
    selectedPlaceColor = TAB_SWATCHES[data.locations.length % TAB_SWATCHES.length];
    document.getElementById('placeOverlayLabel').textContent = 'New Storage Place';
    document.getElementById('placeOverlayTitle').textContent = 'Add a place';
    document.getElementById('placeSave').textContent = 'Save';
    renderPlaceForm();
    const nameInput = document.getElementById('placeName');
    nameInput.value = '';
    nameInput.classList.remove('input-error');
    document.getElementById('addPlaceOverlay').classList.add('show');
    nameInput.focus();
  }

  function openEditPlace(locId){
    const loc = data.locations.find(l => l.id === locId);
    if(!loc) return;
    editingLocId = locId;
    selectedPlaceIcon = loc.icon || `svg:${KITCHEN_ICONS[0].id}`;
    selectedPlaceColor = loc.color || TAB_SWATCHES[0];
    document.getElementById('placeOverlayLabel').textContent = 'Edit Storage Place';
    document.getElementById('placeOverlayTitle').textContent = 'Edit place';
    document.getElementById('placeSave').textContent = 'Save changes';
    renderPlaceForm();
    const nameInput = document.getElementById('placeName');
    nameInput.value = loc.name;
    nameInput.classList.remove('input-error');
    document.getElementById('addPlaceOverlay').classList.add('show');
    nameInput.focus();
  }


  document.getElementById('placeCancel').onclick = () => {
    document.getElementById('addPlaceOverlay').classList.remove('show');
  };

  function saveNewPlace(){
    const nameInput = document.getElementById('placeName');
    const name = nameInput.value.trim();
    if(!name){
      nameInput.classList.add('input-error');
      nameInput.focus();
      return;
    }
    if(editingLocId){
      const loc = data.locations.find(l => l.id === editingLocId);
      if(loc){
        loc.name = name;
        loc.icon = selectedPlaceIcon;
        loc.color = selectedPlaceColor;
      }
    } else {
      const id = uid('loc');
      data.locations.push({id, name, icon: selectedPlaceIcon, color: selectedPlaceColor});
      data.activeLocation = id;
    }
    saveData();
    document.getElementById('addPlaceOverlay').classList.remove('show');
    render();
  }
  document.getElementById('placeSave').onclick = saveNewPlace;
  document.getElementById('placeName').addEventListener('keydown', (e) => {
    if(e.key === 'Enter') saveNewPlace();
  });

  // Add a custom icon: paste SVG markup copied from an icon site (see the
  // in-app tips). Stored in localStorage so it's available for every future
  // place you add.
  function openAddCustomIcon(){
    const label = prompt('Name this icon (e.g. "Reach-in Cooler"):');
    if(!label) return;
    let svg = prompt('Paste the SVG code for the icon (the whole <svg>...</svg> tag):');
    if(!svg) return;
    svg = svg.trim();
    if(!/^<svg[\s>]/i.test(svg) || !/<\/svg>\s*$/i.test(svg)){
      alert('That doesn\'t look like SVG markup — it should start with <svg and end with </svg>.');
      return;
    }
    svg = sanitizeSvg(svg);
    const id = uid('icon');
    customIcons.push({id, label, svg});
    saveCustomIcons();
    selectedPlaceIcon = `custom:${id}`;
    renderPlaceForm();
  }


  // ---- Register popup (scan an unknown tag) ----
  let pendingTagId = null;
  function openRegister(tagId){
    pendingTagId = tagId;
    const sel = document.getElementById('regLocation');
    sel.innerHTML = '';
    data.locations.forEach(loc => {
      const opt = document.createElement('option');
      opt.value = loc.id; opt.textContent = loc.name;
      sel.appendChild(opt);
    });
    const newOpt = document.createElement('option');
    newOpt.value = '__new__'; newOpt.textContent = '+ new place...';
    sel.appendChild(newOpt);
    document.getElementById('regName').value = '';
    document.getElementById('regCount').value = 1;
    document.getElementById('registerOverlay').classList.add('show');
  }
  document.getElementById('regSave').onclick = () => {
    let locId = document.getElementById('regLocation').value;
    if(locId === '__new__'){
      const name = prompt('Name this storage place:');
      if(!name) return;
      locId = uid('loc');
      data.locations.push({id:locId, name, icon:'svg:box'});
    }
    const name = document.getElementById('regName').value.trim();
    if(!name){ alert('Give the item a name first.'); return; }
    const count = parseInt(document.getElementById('regCount').value, 10) || 0;
    const id = uid('item');
    data.items.push({id, tagId: pendingTagId, locationId: locId, name, count});
    data.activeLocation = locId;
    saveData();
    document.getElementById('registerOverlay').classList.remove('show');
    if(window.history && window.history.replaceState){
      window.history.replaceState({}, '', window.location.pathname);
    }
    render();
  };

  // ---- Tag link popup (show URL to write onto a physical tag) ----
  function showLink(itemId){
    const it = data.items.find(i => i.id === itemId);
    if(!it) return;
    const url = window.location.origin + window.location.pathname + '?tag=' + it.tagId;
    document.getElementById('linkItemName').textContent = it.name;
    document.getElementById('linkUrlText').textContent = url;
    document.getElementById('linkUrlBox').onclick = () => {
      navigator.clipboard && navigator.clipboard.writeText(url);
      document.getElementById('linkUrlBox').querySelector('.hint').textContent = 'Copied!';
    };
    document.getElementById('linkOverlay').classList.add('show');
  }
  document.getElementById('linkDone').onclick = () => {
    document.getElementById('linkOverlay').classList.remove('show');
  };

  // ---- Export all current data to a dated CSV file ----
  function todayDateString(){
    const d = new Date();
    const yyyy = d.getFullYear();
    const mm = String(d.getMonth() + 1).padStart(2, '0');
    const dd = String(d.getDate()).padStart(2, '0');
    return `${yyyy}-${mm}-${dd}`;
  }
  function csvEscape(val){
    const s = String(val);
    if(/[",\n]/.test(s)){ return '"' + s.replace(/"/g, '""') + '"'; }
    return s;
  }
  function exportCsv(){
    const rows = [['Location', 'Item', 'Count', 'Tag ID']];
    data.items.forEach(it => {
      const loc = data.locations.find(l => l.id === it.locationId);
      rows.push([loc ? loc.name : '(unknown place)', it.name, it.count, it.tagId]);
    });
    const csvContent = rows.map(r => r.map(csvEscape).join(',')).join('\n');
    const blob = new Blob([csvContent], {type: 'text/csv;charset=utf-8;'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `inventory-${todayDateString()}.csv`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }
  document.getElementById('exportCsvBtn').onclick = exportCsv;

  // ---- Swipe left/right between places (mobile) ----
  function switchLocation(direction){
    const idx = data.locations.findIndex(l => l.id === data.activeLocation);
    if(idx === -1) return;
    const nextIdx = idx + direction;
    if(nextIdx < 0 || nextIdx >= data.locations.length) return;
    data.activeLocation = data.locations[nextIdx].id;
    saveData();
    render();
    const pageEl = document.getElementById('page');
    const animClass = direction > 0 ? 'swipe-in-left' : 'swipe-in-right';
    pageEl.classList.remove('swipe-in-left', 'swipe-in-right');
    void pageEl.offsetWidth; // restart the animation even if the same class is reused
    pageEl.classList.add(animClass);
  }

  (function setupSwipe(){
    const pageEl = document.getElementById('page');
    let startX = 0, startY = 0, tracking = false;
    pageEl.addEventListener('touchstart', (e) => {
      if(e.touches.length !== 1) return;
      startX = e.touches[0].clientX;
      startY = e.touches[0].clientY;
      tracking = true;
    }, {passive:true});
    pageEl.addEventListener('touchend', (e) => {
      if(!tracking) return;
      tracking = false;
      const touch = e.changedTouches[0];
      const dx = touch.clientX - startX;
      const dy = touch.clientY - startY;
      // Require a clearly horizontal, deliberate drag so vertical scrolling
      // and normal taps never get mistaken for a swipe.
      if(Math.abs(dx) < 60 || Math.abs(dx) < Math.abs(dy) * 1.5) return;
      switchLocation(dx < 0 ? 1 : -1);
    }, {passive:true});
  })();

  // ---- Entry point: check URL for ?tag= on load ----
  function checkTagParam(){
    const params = new URLSearchParams(window.location.search);
    const tagId = params.get('tag');
    if(!tagId) return;
    const it = data.items.find(i => i.tagId === tagId);
    if(it){
      data.activeLocation = it.locationId;
      saveData();
      render();
      openAdjust(it.id);
    } else {
      render();
      openRegister(tagId);
    }
  }

  render();
  checkTagParam();
</script>

</body>
