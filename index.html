<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NFC Test Page</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background-color: #000000;
    color: #ffffff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    transition: background-color 0.8s ease, color 0.8s ease;
    text-align: center;
    flex-direction: column;
    gap: 12px;
  }

  body.nfc-active {
    background-color: #ff69b4;
    color: #1a0010;
  }

  h1 {
    font-size: 1.8rem;
    letter-spacing: 0.5px;
  }

  p {
    font-size: 1rem;
    opacity: 0.8;
  }

  .status {
    margin-top: 20px;
    font-size: 0.85rem;
    padding: 6px 14px;
    border: 1px solid currentColor;
    border-radius: 20px;
    opacity: 0.7;
  }
</style>
</head>
<body>

  <h1 id="title">Waiting for NFC tap...</h1>
  <p id="subtitle">Background will turn pink when opened via the NFC tag link.</p>
  <div class="status" id="status">status: default (black)</div>

  <script>
    // Reads the URL for a query parameter like ?nfc=pink
    // Example NFC tag URL: https://yoursite.github.io/nfc-test.html?nfc=pink
    const params = new URLSearchParams(window.location.search);
    const nfcValue = params.get('nfc');

    if (nfcValue === 'pink') {
      document.body.classList.add('nfc-active');
      document.getElementById('title').textContent = 'NFC Tag Detected!';
      document.getElementById('subtitle').textContent = 'You opened this page by tapping the NFC tag.';
      document.getElementById('status').textContent = 'status: unlocked (pink)';
    }
  </script>

</body>
</html>
